# Render Blueprint (optional). In Render: New > Blueprint > pick your GitHub repo.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
databases:
  - name: ai-news-db
    plan: free
    databaseName: ai_news

services:
  - type: web
    name: ai-news-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Runs migrations, then starts the API. --forwarded-allow-ips lets the app see real client IPs behind Render's proxy.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GNEWS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FRONTEND_URL
        sync: false   # e.g. https://your-app.vercel.app
