# Local PostgreSQL for development:  docker compose up -d
# These credentials are for local development only. Never reuse them in production.
services:
  db:
    image: postgres:16-alpine
    container_name: ai_news_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: newsapp
      POSTGRES_PASSWORD: newsapp_password
      POSTGRES_DB: ai_news
    ports:
      - "5432:5432"
    volumes:
      - ai_news_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsapp -d ai_news"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ai_news_pgdata:
